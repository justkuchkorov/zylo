<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#111a17"/>
      <stop offset=".65" stop-color="#17342d"/>
      <stop offset="1" stop-color="#0c9b79"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
      .sans { font-family: Inter, Arial, sans-serif; font-weight: 900; }
      .muted { fill: #bad2ca; }
      .green { fill: #0c9b79; }
    </style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <path d="M-40 980 C220 710 430 900 625 615 S878 292 1160 470" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="7" stroke-dasharray="20 18"/>
  <text x="78" y="110" fill="#fff" class="sans" font-size="34">Zylo</text>
  <text x="76" y="284" fill="#fff" class="serif" font-size="111">The flight</text>
  <text x="76" y="397" fill="#fff" class="serif" font-size="111">was cheap.</text>
  <text x="76" y="542" fill="#fff" class="serif" font-size="111" font-style="italic">The trip</text>
  <text x="76" y="655" fill="#fff" class="serif" font-size="111" font-style="italic">was not.</text>
  <text x="82" y="738" class="muted sans" font-size="31">Zylo checks if a route is actually worth taking.</text>
  <g filter="url(#shadow)" transform="translate(92 830)">
    <rect width="896" height="312" rx="42" fill="#fff"/>
    <g transform="translate(42 40)">
      <text x="0" y="32" fill="#66736d" class="sans" font-size="22">CHEAP BUT BAD</text>
      <text x="0" y="100" fill="#101916" class="serif" font-size="70">€49 flight</text>
      <text x="0" y="150" fill="#66736d" class="sans" font-size="28">arrives 23:15 · leaves tomorrow</text>
      <text x="0" y="206" fill="#ff6078" class="sans" font-size="34">22/100 real trip</text>
    </g>
    <g transform="translate(558 54)">
      <rect width="250" height="204" rx="32" fill="#e2f6ed"/>
      <text x="34" y="58" fill="#0c9b79" class="sans" font-size="24">ZYLO SAYS</text>
      <text x="34" y="115" fill="#101916" class="sans" font-size="34">Skip it.</text>
      <text x="34" y="160" fill="#66736d" class="sans" font-size="22">Not enough city time.</text>
    </g>
  </g>
  <rect x="78" y="1192" width="286" height="72" rx="36" fill="#fff"/>
  <text x="124" y="1239" fill="#101916" class="sans" font-size="27">Beta soon</text>
</svg>
